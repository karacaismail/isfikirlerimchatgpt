name: Doğrula ve GitHub Pages yayımla
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Yeni commitlerin kişisel yazarlık kuralı
        env:
          EXPECTED_IDENTITY: karacaismail <35493655+karacaismail@users.noreply.github.com>
        run: |
          range="HEAD"
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            range="${{ github.event.pull_request.base.sha }}..${{ github.event.pull_request.head.sha }}"
          fi
          while IFS= read -r commit; do
            test "$(git show -s --format='%an <%ae>' "$commit")" = "$EXPECTED_IDENTITY"
            test "$(git show -s --format='%cn <%ce>' "$commit")" = "$EXPECTED_IDENTITY"
            if git show -s --format='%B' "$commit" | grep -Eiq 'co-authored-by:|generated.with|claude.*session'; then
              echo 'İzin verilmeyen commit imzası'
              exit 1
            fi
          done < <(git rev-list "$range")
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 24.21.0
          cache: npm
      - name: Sabit araç ve bağımlılıklar
        run: |
          npm install --global npm@11.19.0 --ignore-scripts
          npm ci --ignore-scripts
      - name: Statik kontroller ve üretim derlemesi
        run: |
          npm run format:check
          npm run check
          npm test
          npm run build
      - name: Üç tarayıcı motorunu hazırla
        run: npx playwright install --with-deps chromium firefox webkit
      - name: Üretim çıktısında davranış, erişim ve ağ kontrolleri
        run: npm run test:browser
      - name: İncelenebilir görsel kanıtlar
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: visual-candidates
          path: |
            test-results/**/*.png
            test-results/**/*.json
            test-results/**/error-context.md
          retention-days: 7
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5
        if: github.event_name != 'pull_request'
        with:
          path: dist
  deploy:
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Pages yayımla
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5
